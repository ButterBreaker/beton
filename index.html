<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Appli de russe Бетон</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400&family=Unbounded:wght@600;800&display=swap">
<style>
:root{
  /* Layout : appli une colonne, panneaux de béton bordés de noir, un seul accent rouge constructiviste, onglets en bas */
  --bg:#d6d4cf;
  --slab:#eceae6;
  --slab-2:#c4c1ba;
  --ink:#18191a;
  --muted:#55575a;
  --red:#c3271b;
  --on-red:#ffffff;
  --good:#2b6837;
  --warn:#9a6200;
  --lamp:#dc9d1f;
  --dot:rgba(24,25,26,.09);
  --font-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --font-body:"PT Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#18191a; --slab:#232527; --slab-2:#3a3d40; --ink:#e8e6e1; --muted:#a4a39e;
    --red:#ff5643; --on-red:#160c0b; --good:#74c482; --warn:#e6a63c; --lamp:#f2c14e; --dot:rgba(232,230,225,.06);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#18191a; --slab:#232527; --slab-2:#3a3d40; --ink:#e8e6e1; --muted:#a4a39e;
  --red:#ff5643; --on-red:#160c0b; --good:#74c482; --warn:#e6a63c; --lamp:#f2c14e; --dot:rgba(232,230,225,.06);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  background-color:var(--bg);
  background-image:radial-gradient(circle,var(--dot) 0 3px,transparent 3.6px);
  background-size:96px 96px;background-position:48px 40px;
  color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.45;
  -webkit-text-size-adjust:100%;
}
#app{height:100%;display:flex;flex-direction:column}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.2;text-wrap:balance;font-weight:600}
h2{font-size:18px}
h3{font-size:14px;letter-spacing:.02em}
p{margin:0}
a{color:var(--ink);text-decoration-color:var(--red);text-decoration-thickness:2px;text-underline-offset:3px}
.small{font-size:14px}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}
.ru{font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:2px solid var(--ink);background:var(--slab)}
.logo{font-family:var(--font-display);font-weight:800;font-size:21px;letter-spacing:.06em;line-height:1}
.logo small{display:block;font-family:var(--font-body);font-weight:400;font-size:13px;letter-spacing:0;color:var(--muted);margin-top:5px}
.sync{font-size:12px;border:1.5px solid var(--ink);padding:3px 8px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.sync::before{content:"";width:7px;height:7px;background:var(--muted)}
.sync[data-s="ok"]::before{background:var(--good)}
.sync[data-s="saving"]::before{background:var(--warn)}
.sync[data-s="err"]::before{background:var(--red)}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 28px;display:flex;flex-direction:column;gap:16px}

nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:2px solid var(--ink);background:var(--slab)}
nav.tabs button{appearance:none;background:none;border:0;border-top:4px solid transparent;color:var(--muted);font-size:11.5px;padding:6px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-height:56px}
nav.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--red);font-weight:700}
nav.tabs svg{width:22px;height:22px}
.ico-aa{font-family:var(--font-display);font-weight:800;font-size:15px;line-height:22px;height:22px}

.panel{background:var(--slab);border:2px solid var(--ink);padding:16px;display:flex;flex-direction:column;gap:10px}
.panel.center{align-items:center;text-align:center}
.row{display:flex;flex-wrap:wrap;gap:10px}
.btn{appearance:none;border:2px solid var(--ink);background:var(--slab);color:var(--ink);font-weight:700;padding:11px 16px;min-height:48px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn-primary{background:var(--red);border-color:var(--ink);color:var(--on-red);box-shadow:4px 4px 0 var(--ink)}
.btn-primary:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.btn.wide{width:100%}
.btn.danger{border-color:var(--red);color:var(--red)}
.linkbtn{appearance:none;background:none;border:0;padding:4px 0;text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:3px;cursor:pointer;color:var(--muted);align-self:flex-start}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--slab);border:2px solid var(--ink);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--font-display);font-weight:800;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat b small{font-size:14px;font-weight:600;color:var(--muted)}
.stat span{font-size:13px;color:var(--muted)}

.say{appearance:none;border:2px solid var(--ink);background:var(--slab);color:var(--ink);width:42px;height:42px;display:inline-grid;place-items:center;cursor:pointer;flex:none;padding:0}
.say:active{background:var(--ink);color:var(--slab)}
.say svg{width:22px;height:22px}
.say-row{display:flex;gap:12px;align-items:center}
.say-row.center{justify-content:center}
.phrase-ru{font-size:24px;line-height:1.2}

.task{display:flex;gap:12px;align-items:flex-start;padding:7px 0;cursor:pointer}
.task input{appearance:none;-webkit-appearance:none;width:24px;height:24px;border:2px solid var(--ink);background:var(--slab);flex:none;margin:1px 0 0;display:grid;place-items:center;cursor:pointer}
.task input:checked{background:var(--red);border-color:var(--red)}
.task input:checked::after{content:"";width:11px;height:6px;border-left:3px solid var(--on-red);border-bottom:3px solid var(--on-red);transform:translateY(-2px) rotate(-45deg)}
.task input:checked + span{color:var(--muted);text-decoration:line-through}
.task em{font-style:normal}

.group{display:flex;flex-direction:column;gap:8px}
.group h3{font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.tile{appearance:none;background:var(--slab);border:2px solid var(--ink);color:var(--ink);padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
.tile .L{font-weight:700;font-size:27px;line-height:1.15}
.tile .s{font-size:12.5px;color:var(--muted);line-height:1.2;text-align:center}
.pips{display:flex;gap:3px;margin-top:5px}
.pips i{width:12px;height:4px;background:var(--slab-2)}
.pips i.on{background:var(--red)}
.tile.mastered{background:var(--ink);color:var(--slab)}
.tile.mastered .s{color:inherit;opacity:.75}
.tile.mastered .pips i{background:var(--red)}

.decks{display:flex;flex-direction:column}
.deck{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;padding:12px 0;border-top:1.5px solid var(--slab-2)}
.deck:first-child{border-top:0;padding-top:4px}
.deck-name{font-weight:700}
.deck-sub{font-size:14px;color:var(--muted)}
.meter{grid-column:1/-1;height:8px;background:var(--slab-2);position:relative}
.meter i{position:absolute;top:0;bottom:0;left:0}
.meter .seen{background:var(--muted);opacity:.55}
.meter .learned{background:var(--red)}
.deck-count{grid-column:1/-1;font-size:13px;color:var(--muted)}
.switch{position:relative;width:48px;height:28px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;width:100%;height:100%}
.switch span{position:absolute;inset:0;border:2px solid var(--ink);background:var(--slab-2);pointer-events:none}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;background:var(--ink);transition:transform .15s}
.switch input:checked + span{background:var(--red)}
.switch input:checked + span::after{transform:translateX(20px);background:var(--slab)}
.switch input:focus-visible + span{outline:3px solid var(--red);outline-offset:2px}
.set-row{display:flex;flex-direction:column;gap:6px}
.set-line{display:flex;justify-content:space-between;align-items:center;gap:12px}
.seg{display:flex;border:2px solid var(--ink)}
.seg button{flex:1;appearance:none;border:0;border-left:2px solid var(--ink);background:var(--slab);padding:9px 6px;cursor:pointer;min-height:44px}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--slab);font-weight:700}

details.week{background:var(--slab);border:2px solid var(--ink)}
details.week>summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
details>summary::-webkit-details-marker{display:none}
.wk-num{font-family:var(--font-display);font-weight:800;font-size:17px;width:40px;height:40px;display:grid;place-items:center;border:2px solid var(--ink)}
details.week.current .wk-num{background:var(--red);color:var(--on-red);border-color:var(--red)}
details.week.done .wk-num{background:var(--ink);color:var(--slab)}
.wk-t{display:block;font-family:var(--font-display);font-size:14px;font-weight:600}
.wk-o{display:block;font-size:14px;color:var(--muted)}
.wk-body{padding:0 14px 12px;display:flex;flex-direction:column}
details.memo{border-top:1.5px solid var(--slab-2)}
details.memo>summary{list-style:none;cursor:pointer;padding:11px 0;font-weight:700;display:flex;justify-content:space-between;gap:12px}
details.memo>summary::after{content:"+";font-family:var(--font-display);font-weight:800}
details.memo[open]>summary::after{content:"−"}
.memo-body{padding:0 0 12px;display:flex;flex-direction:column;gap:8px}
.tbl{overflow-x:auto}
table.conj{border-collapse:collapse;font-size:15px}
table.conj th,table.conj td{border:1.5px solid var(--slab-2);padding:6px 9px;text-align:left}
table.conj th{font-weight:700}
.res{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.res li{display:flex;flex-direction:column}

.ov{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column}
.ov-top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:2px solid var(--ink);background:var(--slab)}
.x{appearance:none;border:2px solid var(--ink);background:var(--slab);width:40px;height:40px;display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.x svg{width:18px;height:18px}
.bar{flex:1;height:12px;border:2px solid var(--ink);background:var(--slab)}
.bar i{display:block;height:100%;background:var(--red);transition:width .2s}
.ov-body{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:16px;max-width:640px;width:100%;margin:0 auto}
.ov-foot{padding:12px 16px 16px;border-top:2px solid var(--ink);background:var(--slab)}
.ov-foot>*{max-width:608px;margin:0 auto}
.card{background:var(--slab);border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:22px 18px;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.card.is-new{border-top:8px solid var(--red)}
.card.tappable{cursor:pointer}
.big{font-size:clamp(34px,10vw,50px);line-height:1.1;font-weight:700;overflow-wrap:anywhere}
.big.fr{font-family:var(--font-body)}
.pron{font-style:italic;color:var(--muted);font-size:18px}
.mean{font-size:22px;font-weight:700}
hr.cut{width:100%;border:0;border-top:2px solid var(--ink);margin:4px 0}
.ex{display:flex;gap:12px;align-items:center;text-align:left;border-top:1.5px dashed var(--slab-2);padding-top:12px;width:100%}
.note{border-left:4px solid var(--slab-2);padding-left:10px;text-align:left;width:100%}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grade{appearance:none;border:2px solid var(--ink);background:var(--slab);padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:60px;cursor:pointer}
.grade b{font-size:15px}
.grade span{font-size:12px;color:var(--muted)}
.g0{background:var(--red);color:var(--on-red);border-color:var(--red)}
.g2{background:var(--ink);color:var(--slab)}
.g0 span,.g2 span{color:inherit;opacity:.85}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{appearance:none;min-height:58px;border:2px solid var(--ink);background:var(--slab);font-weight:700;font-size:17px;cursor:pointer;padding:8px}
.opt:disabled{cursor:default}
.opt.right{background:var(--good);border-color:var(--good);color:var(--slab)}
.opt.wrong{background:var(--red);border-color:var(--red);color:var(--on-red)}
.fb{border-left-width:8px}
.fb.ok{border-left-color:var(--good)}
.fb.ko{border-left-color:var(--red)}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--slab);border:2px solid var(--ink);border-bottom:0;width:100%;max-width:640px;padding:18px 16px 26px;display:flex;flex-direction:column;gap:12px}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}

.chat{display:flex;flex-direction:column;gap:12px}
.msg-u{align-self:flex-end;max-width:85%;background:var(--ink);color:var(--slab);padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg-t{align-self:flex-start;max-width:94%;background:var(--slab);border:2px solid var(--ink);padding:12px;display:flex;flex-direction:column;gap:8px}
.msg-err{align-self:flex-start;border-left:4px solid var(--red);padding:4px 10px;color:var(--muted)}
.tutor-ru{font-size:19px;line-height:1.3}
.fix{border-left:4px solid var(--warn);padding:6px 10px;background:var(--slab);background:color-mix(in srgb,var(--warn) 12%,var(--slab))}
.aide{border-left:4px solid var(--slab-2);padding:2px 10px}
.typing{color:var(--muted);font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:2px solid var(--ink);background:var(--slab);padding:8px 12px;cursor:pointer;font-size:15px;text-align:left}
.compose{position:sticky;bottom:0;display:flex;gap:8px;padding:12px 0 2px;background:var(--bg)}
.compose input{flex:1;min-width:0;border:2px solid var(--ink);background:var(--slab);color:var(--ink);font:inherit;padding:10px 12px;min-height:48px;border-radius:0}
.compose .btn{box-shadow:none}

.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:var(--ink);color:var(--slab);padding:10px 14px;z-index:40;max-width:calc(100% - 32px);font-size:15px}

/* Arcade */
.hero{display:grid;grid-template-columns:112px 1fr;gap:14px;align-items:end}
.bld{width:112px;height:auto;display:block}
.b-slab{fill:var(--slab-2);stroke:var(--ink);stroke-width:2}
.b-build{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:4 3}
.b-win{fill:#2a2c2f}
.b-lit{fill:var(--lamp)}
.b-ghost{fill:none;stroke:var(--muted);stroke-width:1}
.b-crane{fill:none;stroke:var(--red);stroke-width:2.5}
.b-ground{stroke:var(--ink);stroke-width:3}
.b-txt{font:700 8px var(--font-body);fill:var(--muted)}
.hero-info{display:flex;flex-direction:column;gap:6px;min-width:0}
.hero-info h2{font-size:22px;font-weight:800}
.lvl-bar{height:12px;border:2px solid var(--ink);background:var(--slab)}
.lvl-bar i{display:block;height:100%;background:var(--red)}
.goal-head{display:flex;justify-content:space-between;gap:8px;margin-bottom:5px}
.goal{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.goal i{height:12px;background:var(--slab-2)}
.goal i.on{background:var(--lamp)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1.5px solid var(--slab-2);padding-top:10px}
.mini div{display:flex;flex-direction:column}
.mini b{font-family:var(--font-display);font-weight:800;font-size:18px}
.mini span{font-size:12.5px;color:var(--muted)}
.quest{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1.5px solid var(--slab-2)}
.q-t{font-weight:700;line-height:1.3}
.q-bar{height:8px;background:var(--slab-2);margin:7px 0 4px}
.q-bar i{display:block;height:100%;background:var(--red)}
.quest.done .q-t{color:var(--muted);text-decoration:line-through}
.quest.done .q-bar i{background:var(--good)}
.q-act{display:flex;flex-direction:column;gap:4px;align-items:center}
.btn.sm{min-height:42px;padding:7px 12px;font-size:15px;min-width:92px}
.reroll{appearance:none;background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:2px;cursor:pointer;padding:2px}
.done-badge{width:42px;height:42px;display:grid;place-items:center;background:var(--good);color:var(--slab)}
.done-badge svg{width:22px;height:22px}
.chest{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;border-top:2px solid var(--ink);padding-top:12px}
.chest svg{width:56px;height:44px}
.c-box,.c-lid{fill:var(--slab-2);stroke:var(--ink);stroke-width:2}
.chest-ready .c-lid{fill:var(--red)}
.chest-open .c-lid{fill:var(--lamp)}
.c-lock{fill:var(--ink)}
.c-glow{fill:var(--lamp)}
.hud{display:flex;justify-content:space-between;align-items:center;min-height:32px;gap:12px}
.combo{font-family:var(--font-display);font-weight:800;font-size:13px;border:2px solid var(--ink);padding:4px 9px;background:var(--slab)}
.combo.warm{background:var(--lamp);border-color:var(--lamp);color:#18191a}
.combo.hot{background:var(--red);border-color:var(--red);color:var(--on-red)}
.hud-xp{font-family:var(--font-display);font-weight:800;font-size:16px;color:var(--red);animation:pop .7s ease-out both}
@keyframes pop{0%{transform:translateY(10px) scale(.7);opacity:0}35%{transform:translateY(0) scale(1.2);opacity:1}100%{transform:translateY(-3px) scale(1);opacity:1}}
.ov:not([hidden]) ~ .toast{top:6px;bottom:auto;font-size:13px;padding:7px 10px;max-width:calc(100% - 128px);line-height:1.3}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.sum div{border:2px solid var(--ink);padding:8px;display:flex;flex-direction:column}
.sum b{font-family:var(--font-display);font-weight:800;font-size:20px}
.sum span{font-size:12.5px;color:var(--muted)}
.qlist{margin:0;padding:0;list-style:none;text-align:left;width:100%;display:flex;flex-direction:column;gap:4px}
.qlist li{border-left:4px solid var(--good);padding-left:8px;font-size:15px}

/* Leçons : exercices */
.ex-title{font-family:var(--font-display);font-weight:600;font-size:19px;line-height:1.25}
.prompt{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0;text-align:center}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{appearance:none;border:2px solid var(--ink);background:var(--slab);min-height:56px;padding:10px 14px;text-align:left;font-size:18px;cursor:pointer;display:flex;gap:12px;align-items:center;box-shadow:0 4px 0 var(--ink)}
.choice:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.choice:disabled{cursor:default}
.choice .k{font-size:12px;border:1.5px solid var(--muted);color:var(--muted);width:22px;height:22px;display:grid;place-items:center;flex:none;font-weight:700}
.choice.ru-opt{font-weight:700;font-size:20px}
.choice.right{background:var(--good);border-color:var(--good);color:var(--slab)}
.choice.wrong{background:var(--red);border-color:var(--red);color:var(--on-red)}
.choice.right .k,.choice.wrong .k{border-color:currentColor;color:inherit}
.choices.grid4{display:grid;grid-template-columns:1fr 1fr}

function fresh(){ return {v:1, updatedAt:0, cards:{}, newDay:{k:'',n:0}, days:{}, letters:{}, plan:{}, readQuizzes:0, bestStreak:0, settings:{dir:'ru', perDay:10, auto:true, goal:50, sfx:true, listen:true, speak:true, notif:{on:true, h:19, m:0}, pron:'tap'}, noListenUntil:0, noSpeakUntil:0, decksOff:{}, xp:0, xpDay:{k:'',n:0}, quests:{k:'',list:[],chest:false,reroll:false}, freezes:0, frozen:{}, bestCombo:0, lessons:{}, alphaDone:{}, alphaV:2, voiceHintHidden:false, alphaDay:{k:'',n:0}, lrevDay:'', arcadeBest:0, modes:{}, mondeSeen:{}, trace:{}, practice:{}, xpHist:{}, boss:{hist:{}, wins:0}, audio:{dir:'fr', pause:3}}; }

/* Progression : navigateur + carnet du téléphone (appli Android), le plus récent gagne */

var remote = {ref:null, writing:false, pending:false, timer:null};

function setSync(s){ var el=$('#sync'); el.dataset.s=s; el.textContent=SYNC_TXT[s]; }
function scheduleRemote(){ if(!remote.ref) return; clearTimeout(remote.timer); remote.timer=setTimeout(pushRemote,1500); }
function pushRemote(){
  if(!remote.ref) return;

    .then(function(){ setSync('ok'); }, function(){ setSync('err'); })

}
function extract(got){
  if(!got) return null;
  if(typeof got.data==='function') return got.exists===false ? null : got.data();
  if(got.data && typeof got.data==='object') return got.data;

/* ---------- Statistiques ---------- */
function isActive(k){ return !!(S.days[k] || S.frozen[k]); }
function streak(){
  var n=0, d=new Date(); d.setHours(0,0,0,0);
  if(!isActive(keyOf(d))) d.setDate(d.getDate()-1);
  while(isActive(keyOf(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
/* Un gel de série couvre un jour raté, si la série d'avant existait */
function applyFreezes(){
  if(!(S.freezes>0) || !Object.keys(S.days).length) return;
  var d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-1);
  var gaps=[], guard=0;
  while(!isActive(keyOf(d)) && guard<40){ gaps.push(keyOf(d)); d.setDate(d.getDate()-1); guard++; }
  if(!gaps.length || guard>=40 || gaps.length>S.freezes) return;
  gaps.forEach(function(k){ S.frozen[k]=true; });

  pushToast(gaps.length>1 ? gaps.length+' gels ont protégé ta série.' : 'Un gel a protégé ta série.');
}

function bumpLetter(i, ok, runGain){

function eligible(id, st, due){
  switch(id){
    case 'due': return due>=5;
    case 'lesson': return !!nextLesson();
    case 'alpha': return nextAlpha()>=0;
    case 'neu': return false; /* remplacée par « lesson » */
    case 'combo': return true;
    case 'fr': return st.seen>=4 || !!nextLesson();
    case 'perfect': return !!nextLesson() || st.seen>=4;
    case 'letters': return st.letters<33;
    case 'prof': return sampleFn!==null;
    default: return true;
  }
}
function makeQuest(id, due){
  var t=1;
  if(id==='due') t=due;
  else if(id==='neu') t=Math.max(1, Math.min(S.settings.perDay, newAvailable(), 10));
  else if(id==='lesson'){ var left=LESSONS.filter(function(l){ return !S.lessons[l.id]; }).length; t=Math.max(1, Math.min(nextAlpha()>=0 ? 1 : 2, left)); }
  else if(id==='combo') t=stats().seen>=30 ? 12 : 8;
  else if(id==='fr') t=8;
  else if(id==='prof') t=3;
  else if(id==='xp') t=S.settings.goal;
  return {id:id, target:t, prog:0, done:false};
}
/* Quête 1 : le cœur (révisions ou nouveaux mots). Quête 2 : une compétence. Quête 3 : l'immersion. */
function genQuests(){
  var st=stats(), due=dueCount(), h=hashStr(todayKey()), list=[];
  function has(id){ return list.some(function(q){ return q.id===id; }); }
  function pickFrom(arr, salt){ var el=arr.filter(function(id){ return eligible(id,st,due) && !has(id); }); return el.length ? el[(h>>>salt)%el.length] : null; }
  list.push(makeQuest(due>=5 ? 'due' : (eligible('lesson',st,due) ? 'lesson' : 'xp'), due));
  var b = nextAlpha()>=0 ? 'alpha' : st.letters<33 ? pickFrom(['letters','read'],2) : pickFrom(['combo','fr','perfect'],2);
  if(b) list.push(makeQuest(b,due));
  var c = pickFrom(['listen','prof','xp','combo'],5);
  if(c) list.push(makeQuest(c,due));
  ['xp','read','listen'].forEach(function(id){ if(list.length<3 && !has(id)) list.push(makeQuest(id,due)); });
  S.quests={k:todayKey(), list:list, chest:false, reroll:false};
  writeLocal(); /* sans toucher updatedAt : ne doit pas écraser une sauvegarde distante */
}
function ensureQuests(){ if(S.quests.k!==todayKey() || !S.quests.list.length) genQuests(); }
function qText(q){
  switch(q.id){
    case 'due': return 'Révise tes '+q.target+' cartes du jour';
    case 'neu': return 'Apprends '+q.target+' nouvelle'+(q.target>1?'s':'')+' carte'+(q.target>1?'s':'');
    case 'lesson': return 'Termine '+q.target+' leçon'+(q.target>1?'s':'');
    case 'alpha': return 'Fais une leçon d’alphabet';
    case 'combo': return 'Enchaîne '+q.target+' bonnes réponses d’affilée';
    case 'fr': return 'Réussis '+q.target+' exercices « vers le russe »';
    case 'perfect': return 'Termine une leçon sans aucune erreur';
    case 'letters': return 'Révise tes lettres (révision, quiz ou jeu des 60 s)';
    case 'read': return 'Lis sans faute (quiz de lecture, ville soviétique…)';
    case 'listen': return 'Écoute 10 minutes de vrai russe';
    case 'prof': return 'Envoie '+q.target+' messages en russe au prof IA';
    case 'xp': return 'Gagne '+q.target+' XP aujourd’hui';
  }
  return q.id;
}
function progOf(q){
  if(q.done) return q.target;
  if(q.id==='due') return Math.max(0, Math.min(q.target, q.target-dueCount()));
  if(q.id==='xp') return Math.min(q.target, xpToday());
  return Math.min(q.target, q.prog||0);
}
function questEvent(type, p){
  ensureQuests();
  S.quests.list.forEach(function(q){
    if(q.done) return;
    if(type==='grade'){
      if(q.id==='neu' && p.isNew) q.prog++;
      if(q.id==='combo') q.prog=Math.max(q.prog||0, p.combo);
      if(q.id==='fr' && p.dir==='fr' && p.g>=1) q.prog++;
    } else if(type==='session-end'){
      if(q.id==='perfect' && p.fails===0 && p.done>=5) q.prog=1;
    } else if(type==='quiz-end'){
      if(q.id==='letters' && p.type==='letters' && p.score>=10) q.prog=1;
      if(q.id==='letters' && p.type==='arcade' && p.score>=15) q.prog=1;
      if(q.id==='read' && p.type==='read' && p.score===p.n) q.prog=1;
    } else if(type==='answer'){
      if(q.id==='combo') q.prog=Math.max(q.prog||0, p.combo);
      if(q.id==='fr' && p.production && p.correct) q.prog++;
    } else if(type==='lesson-end'){
      if(q.id==='lesson' && (p.kind==='vocab' || p.kind==='gram') && !p.replay) q.prog++;
      if(q.id==='alpha' && p.kind==='alpha' && !p.replay) q.prog++;
      if(q.id==='perfect' && p.kind!=='alpha' && p.mistakes===0 && !p.replay) q.prog=1;
      if(q.id==='neu' && p.newWords) q.prog+=p.newWords;
      if(q.id==='letters' && (p.kind==='lrev' || p.kind==='trace')) q.prog=1;
      if(q.id==='read' && (p.kind==='fc' || p.kind==='ville' || p.kind==='story') && p.mistakes===0) q.prog=1;
    } else if(type==='prof' && q.id==='prof'){ q.prog++; }
    else if(type==='honor' && q.id===p.id){ q.prog=1; }
  });
}
function allQuestsDone(){ return S.quests.list.length>0 && S.quests.list.every(function(q){ return q.done; }); }
function checkQuests(){
  ensureQuests();

    S.quests.list.forEach(function(q){
      if(!q.done && progOf(q)>=q.target){

        addXP(Q[q.id].xp);

        if(SES) SES.quests.push(qText(q));

    });

}

function rerollQuest(i){

function questGo(id){
  var a=Q[id] && Q[id].act;
  if(a==='lesson' || a==='session'){ if(!startNextLesson()) startReview(); }

function nextState(st, g, failedBefore){
  var b = st.b||0, nb;
  if(g===0) return {b:0, d:Date.now()};
  if(failedBefore){ nb = g===3 ? 2 : 1; return {b:nb, d:dayStart(IV[nb])}; }
  if(g===1){ nb=Math.max(1,b); return {b:nb, d:dayStart(Math.max(1, Math.round(IV[nb]*0.5)))}; }
  if(g===2){ nb=Math.min(6,b+1); return {b:nb, d:dayStart(IV[nb])}; }
  nb=Math.min(6,b+2); return {b:nb, d:dayStart(IV[nb])};
}

/* ---------- Quiz ---------- */
var QZ=null;
function startQuiz(type){
  closeSheet(); clearToasts(); arcStop(); ARC=null; audStop(); AUD=null; RUN=null; SES=null;
  var items;
  if(type==='letters'){
    var pool = shuffle(LETTERS.map(function(_,i){return i;}));
    pool.sort(function(a,b){ return (S.letters['L'+a]||0)-(S.letters['L'+b]||0); });
    items = shuffle(pool.slice(0,12));
  } else {
    items = shuffle(READING.map(function(_,i){return i;})).slice(0,8);
  }
  QZ={type:type, items:items, pos:0, score:0, done:false};
  prepQ(); openOv(); renderQuiz();
}
function prepQ(){
  var it=QZ.items[QZ.pos], set=[];
  function add(s){ if(set.indexOf(s)<0) set.push(s); }
  QZ.answered=false; QZ.choice=-1;
  if(QZ.type==='letters'){
    var L=LETTERS[it]; QZ.correct=L[2]; add(L[2]);
    if(TRAPS[L[0]]) add(TRAPS[L[0]]);
    shuffle(LETTERS.map(function(x){return x[2];})).forEach(function(s){ if(set.length<4) add(s); });
  } else {
    var R=READING[it]; QZ.correct=R[1]; add(R[1]);
    shuffle(READING.slice()).forEach(function(r){ if(set.length<4) add(r[1]); });
  }
  QZ.opts=shuffle(set);
}
function renderQuiz(){
  var it=QZ.items[QZ.pos], n=QZ.items.length, ok=QZ.answered && QZ.opts[QZ.choice]===QZ.correct, prompt, fb='';
  if(QZ.type==='letters'){
    var L=LETTERS[it];
    prompt = '<p class="eyebrow">Quel son fait cette lettre ?</p><p class="big ru">'+L[0]+'&thinsp;'+L[1]+'</p>';
    if(QZ.answered) fb = '<div class="panel fb '+(ok?'ok':'ko')+'"><p><b>'+(ok?'Juste.':'Raté, c’est « '+esc(L[2])+' ».')+'</b> '+esc(L[3])+'</p>'
      + '<div class="say-row">'+sayBtn(L[4])+'<p><span class="ru">'+esc(L[4])+'</span> <span class="muted">· '+esc(L[5])+'</span></p></div></div>';
  } else {
    var R=READING[it];
    prompt = '<p class="eyebrow">Lis ce mot. Ça veut dire…</p><p class="big ru">'+esc(R[0])+'</p>';
    if(QZ.answered) fb = '<div class="panel fb '+(ok?'ok':'ko')+'"><div class="say-row">'+sayBtn(R[0])+'<p><b>'+(ok?'Juste.':'Raté.')+'</b> <span class="ru">'+esc(R[0])+'</span> = '+esc(R[1])+'</p></div></div>';
  }
  var opts = QZ.opts.map(function(o,k){
    var cls='opt';
    if(QZ.answered){ if(o===QZ.correct) cls+=' right'; else if(k===QZ.choice) cls+=' wrong'; }
    return '<button class="'+cls+'" data-act="qz-pick" data-i="'+k+'"'+(QZ.answered?' disabled':'')+'>'+esc(o)+'</button>';
  }).join('');
  var shown = QZ.pos + (QZ.answered?1:0);
  $('#ov').innerHTML = '<div class="ov-top"><button class="x" data-act="close" aria-label="Fermer">'+XI+'</button><div class="bar"><i style="width:'+Math.round(shown/n*100)+'%"></i></div><span class="small tnum">'+shown+'/'+n+'</span></div>'
    + '<div class="ov-body"><div class="card" style="min-height:190px">'+prompt+'</div><div class="opts">'+opts+'</div>'+fb+'</div>'
    + '<div class="ov-foot">'+(QZ.answered?'<button class="btn btn-primary wide" data-act="qz-next">'+(QZ.pos+1<n?'Suivant':'Voir le score')+'</button>':'<p class="small muted" style="text-align:center">Choisis une réponse.</p>')+'</div>';
}
function pick(k){

  if(QZ.type==='letters'){ QZ.gain=QZ.gain||{}; bumpLetter(it, ok, QZ.gain); }

/* ---------- Séance de cartes ---------- */
var SES=null;
function startSession(extra, forceDir){
  var now=Date.now(), practice={};
  var due = CARDS.filter(function(c){ var st=S.cards[c.id]; return st && st.d<=now; })
    .sort(function(a,b){ return S.cards[a.id].d - S.cards[b.id].d; }).slice(0,80);
  var neu = []; /* les nouveaux mots arrivent par les leçons ; le mode cartes ne fait que réviser */
  if(!due.length && forceDir!=='fr'){
    var seen = shuffle(CARDS.filter(function(c){ return S.cards[c.id]; })).slice(0,10);
    if(!seen.length){ toast('Fais d’abord une leçon : les mots appris arrivent ici.'); return false; }
    seen.forEach(function(c){ practice[c.id]=true; due.push(c); });
    toast('Rien à réviser : entraînement libre, sans toucher au planning.');
  }
  if(forceDir==='fr'){
    /* Défi FR → RU : d'abord les cartes dues, puis des cartes déjà vues en entraînement (sans toucher au planning) */
    neu = []; due = due.slice(0,10);
    if(due.length<10){
      var filler = shuffle(CARDS.filter(function(c){ var st=S.cards[c.id]; return st && st.d>now; }))
        .sort(function(a,b){ return S.cards[a.id].b - S.cards[b.id].b; }).slice(0, 10-due.length);
      filler.forEach(function(c){ practice[c.id]=true; due.push(c); });
    }
    if(!due.length){ toast('Apprends d’abord quelques cartes, puis reviens au défi.'); return false; }
  }
  if(!due.length && !neu.length){ toast(newAvailable()? 'Rien à réviser pour l’instant.' : 'Tu as vu toutes les cartes des paquets actifs.'); return false; }
  var q=[], i=0, j=0;
  while(i<due.length || j<neu.length){
    for(var k=0;k<3 && i<due.length;k++) q.push(due[i++]);
    if(j<neu.length) q.push(neu[j++]);
  }
  SES={q:q, pos:0, total:q.length, done:0, failed:{}, fails:0, flipped:false, dir:{}, finished:false,
       combo:0, maxCombo:0, xp:0, lastXP:0, quests:[], practice:practice, forceDir:forceDir||null};
  openOv(); showCard();
  return true;
}

var WORDBANK=null;

/* Fabrique d'exercices */
function mk(t, w){
  var st={t:t, w:w, mk:t};
  if(t==='speak'){ st.heard=''; st.final=''; st.listening=false; st.msg=''; }
  else if(t==='ru2fr'){ st.opts=shuffle([w.fr].concat(pickDistract(w,'fr',3))); st.ans=w.fr; }
  else if(t==='fr2ru' || t==='listen'){ st.opts=shuffle([w.ru].concat(pickDistract(w,'ru',3))); st.ans=w.ru; }
  else if(t==='syll') return mkSyll(w) || (w.sign ? mkSign(w) : mk('ru2fr', w));
  else if(t==='miss') return mkMiss(w) || (w.sign ? mkSign(w) : mk('fr2ru', w));
  else if(t==='sign') return mkSign(w);
  else if(t==='build'){
    var word=plain(w.ru).toLowerCase(); st.ans=word;
    if(w.monde){ st.title='Écris en cyrillique'; st.hear=true; }
    st.tiles=shuffle(word.split('').concat(extraLetters(word))).map(function(ch){ return {ch:ch, used:false}; }); st.picked=[];
  } else if(t==='sentence' || t==='exsent'){
    var ru = t==='exsent' ? w.ex : w.ru, tk=toks(ru);
    st.t='sentence'; st.full=ru; st.fr = t==='exsent' ? w.exfr : w.fr; st.ans=tk.map(norm).join(' ');
    st.tiles=shuffle(tk.concat(extraWords(tk))).map(function(x){ return {ch:x.toLowerCase(), used:false}; }); st.picked=[];
  }
  return st;
}
function prodType(w){
  if(isPhraseLike(w)) return sentOK(w.ru) ? 'sentence' : 'fr2ru';
  var o=['fr2ru'], c=S.cards[w.id], known=c && c.b>=2;
  if(buildable(w)){
    if(plain(w.ru).length<=5 || known) o.push('build','build'); else o.push('miss','miss'); /* mot long et neuf : d'abord la lettre manquante */
    o.push('miss');
  }
  if(w.ex && sentOK(w.ex)) o.push('exsent');
  return rnd(o);
}
function recogType(i){ return canListen() && i%2===1 ? 'listen' : 'ru2fr'; }
function pairsStep(items){ return {t:'pairs', items:items, left:shuffle(items.map(function(i){ return i.k; })), right:shuffle(items.map(function(i){ return i.k; })), matched:{}, selA:null, selB:null}; }
function mkPairs(ws){
  var keep=[];
  ws.forEach(function(w){ if(!keep.some(function(x){ return sameMeaning(x.fr, w.fr) || plain(x.ru)===plain(w.ru); })) keep.push(w); });
  return keep.length>=3 ? pairsStep(keep.map(function(w){ return {k:w.id, a:w.ru, b:w.fr, ru:true}; })) : null;
}
function pushIf(arr, st){ if(st) arr.push(st); }

/* Leçon de vocabulaire : présentation, reconnaissance, puis production */
function vocabSteps(W, R){
  var s=[];
  W.forEach(function(w,i){
    s.push({t:'intro', w:w});
    s.push(i%2===0 && sylWordOK(w.ru) ? mk('syll', w) : mk(recogType(i), w));
    if(i>=1) s.push(mk('fr2ru', W[i-1]));
    if(i===2) pushIf(s, mkPairs(W.slice(0,3)));
  });
  shuffle(W.slice()).forEach(function(w){ s.push(mk(prodType(w), w)); });
  if(speakOn()){ var sw=W.filter(isPhraseLike)[0] || rnd(W); s.push(mk('speak', sw)); }
  R.forEach(function(w,i){ s.push(mk(i%2 ? prodType(w) : recogType(i+1), w)); });
  pushIf(s, mkPairs(shuffle(W.concat(R)).slice(0,6)));
  return s;
}
function reviewSteps(R){
  var s=[];
  shuffle(R.slice()).forEach(function(w,i){ s.push(mk(i%3===0 ? prodType(w) : rnd(['ru2fr','fr2ru', canListen()?'listen':'fr2ru']), w)); });
  var rp = R.length>=4 ? mkPairs(shuffle(R.slice()).slice(0,6)) : null;
  if(rp) s.splice(Math.floor(s.length/2), 0, rp);
  shuffle(R.slice()).slice(0, Math.ceil(R.length/2)).forEach(function(w){ s.push(mk(prodType(w), w)); });
  if(speakOn() && R.length>=3) s.splice(s.length-1, 0, mk('speak', rnd(R)));
  return s;
}

/* Leçon d'alphabet */
function mkL(t, i){
  var L=LETTERS[i], st={t:t, i:i}, set=[];
  if(L[6]===4) st.t=t='l2s'; /* les signes n'ont pas de son à deviner */
  function add(x){ if(set.indexOf(x)<0 && set.length<4) set.push(x); }
  if(t==='l2s'){
    add(L[2]); if(TRAPS[L[0]]) add(TRAPS[L[0]]);
    shuffle(LETTERS.map(function(x){ return x[2]; })).forEach(add); st.ans=L[2];
  } else {
    add(L[0]+L[1]);
    (LOOK[L[0]]||[]).forEach(function(u){ LETTERS.forEach(function(x){ if(x[0]===u) add(x[0]+x[1]); }); });
    shuffle(LETTERS.filter(function(x){ return x[6]!==4; }).map(function(x){ return x[0]+x[1]; })).forEach(add); st.ans=L[0]+L[1];
  }
  st.opts=shuffle(set);
  return st;
}
function knownLetters(g){ var s=''; for(var k=0;k<=g;k++) s+=ALPHA_LESSONS[k].letters.toLowerCase(); return s; }
function readable(g){
  var k=knownLetters(g), out=[];
  READING.forEach(function(r,i){ if(plain(r[0]).toLowerCase().split('').every(function(ch){ return k.indexOf(ch)>=0; })) out.push(i); });
  return out;
}
function mkRead(r){
  var R=READING[r], set=[R[1]];
  shuffle(READING.slice()).forEach(function(x){ if(set.length<4 && set.indexOf(x[1])<0) set.push(x[1]); });
  return {t:'lread', r:r, opts:shuffle(set), ans:R[1]};
}
function mkLPairs(ids, g){
  var pool=ids.slice();
  if(pool.length<4){ var kn=knownLetters(g); shuffle(LETTERS.map(function(_,i){ return i; }).filter(function(i){ return kn.indexOf(LETTERS[i][1])>=0 && pool.indexOf(i)<0; })).slice(0,4-pool.length).forEach(function(i){ pool.push(i); }); }
  return pairsStep(pool.map(function(i){ return {k:'L'+i, a:LETTERS[i][0]+LETTERS[i][1], b:LETTERS[i][2], ru:true}; }));
}
function alphaSteps(g){
  var idx=alphaIdx(g), s=[];
  idx.forEach(function(i,k){
    s.push({t:'lintro', i:i});
    s.push(mkL(k%2 ? 's2l' : 'l2s', i));
    if(k%2===1) s.push(mkL('l2s', idx[k-1]));
    if(k%4===3) s.push(mkLPairs(idx.slice(k-3, k+1), g));
  });
  s.push(mkLPairs(shuffle(idx.slice()).slice(0,5), g));
  shuffle(readable(g)).slice(0,2).forEach(function(r){ s.push(mkRead(r)); });
  shuffle(idx.slice()).slice(0,2).forEach(function(i){ s.push(mkL(TRAPS[LETTERS[i][0]] ? 'l2s' : 's2l', i)); });
  return s;
}

/* Leçon de grammaire : la règle, des phrases à compléter, puis des phrases à remettre dans l'ordre */
function gapFull(it){ return it.q.replace('…', it.ans); }
function mkGap(it){ return {t:'gap', it:it, opts:shuffle(it.opts.slice()), ans:it.ans, full:gapFull(it), fr:it.fr}; }
function mkGramSent(it){
  var full=gapFull(it), tk=toks(full);
  return {t:'sentence', gram:true, it:it, full:full, fr:it.fr, ans:tk.map(norm).join(' '),
          tiles:shuffle(tk.concat(extraWords(tk))).map(function(x){ return {ch:x.toLowerCase(), used:false}; }), picked:[]};
}
function gramSteps(G){
  var items=G.items.map(function(it,i){ return Object.assign({idx:i}, it); }), s=[{t:'rule', G:G}];
  items.forEach(function(it){ s.push(mkGap(it)); });
  shuffle(items.filter(function(it){ return toks(gapFull(it)).length>=3; })).slice(0,3).forEach(function(it){ s.push(mkGramSent(it)); });
  shuffle(items.slice()).slice(0,3).forEach(function(it){ s.push(mkGap(it)); });
  return s;
}

/* Réponses */
function requeue(st){
  var n=null;
  if(st.t==='l2s'||st.t==='s2l') n=mkL(st.t, st.i);
  else if(st.t==='lread') n=mkRead(st.r);
  else if(st.t==='gap') n=mkGap(st.it);
  else if(st.gram) n=mkGramSent(st.it);
  else if(st.t==='fc') n=mkFc(st.k);
  else if(st.t==='kbd') n=mkKbd(st.w, st.mode);
  else if(st.w && st.mk) n=mk(st.mk, st.w);
  if(n){ n.retry=true; RUN.q.push(n); }
}
function answer(ok){
  var st=RUN.q[RUN.pos], production=(st.t==='fr2ru'||st.t==='build'||st.t==='sentence'||st.t==='gap'||(st.t==='kbd' && st.mode==='fr'));
  if(!st.retry){ RUN.graded++; if(ok) RUN.first++; }
  if(ok){
    RUN.combo++; if(RUN.combo>RUN.maxCombo) RUN.maxCombo=RUN.combo;
    var base = (st.retry || RUN.replay) ? 1 : production ? 3 : 2, mult = RUN.replay ? 1 : RUN.combo>=10 ? 2 : RUN.combo>=5 ? 1.5 : 1;
    RUN.lastXP=Math.round(base*mult); addXP(RUN.lastXP);
    blip(RUN.combo>=5 && RUN.combo%5===0 ? 'combo' : 'ok');
  } else {
    RUN.combo=0; RUN.lastXP=0; RUN.mistakes[stepKey(st)]=true; blip('bad'); if(!st.noRequeue) requeue(st);
  }
  if(st.t==='l2s'||st.t==='s2l'){ RUN.lgain=RUN.lgain||{}; bumpLetter(st.i, ok, RUN.lgain); }
  questEvent('answer',{correct:ok, production:production, combo:RUN.combo});
  checkQuests(); save();
  RUN.phase='fb'; RUN.fb={ok:ok, msg: ok ? rnd(OKS) : 'Pas tout à fait.'};
  renderRun();
  var t = st.t==='dlg' ? st.ans : st.t==='fc' ? FC[st.k][1] : st.w ? (st.full||st.w.say||st.w.ru) : st.full ? st.full : st.t==='lread' ? READING[st.r][0] : null;
  if(S.settings.auto && listenOn() && t && (production || !ok || ['lread','syll','miss','sign','fc','dlg'].indexOf(st.t)>=0)) setTimeout(function(){ say(t); }, S.settings.sfx ? 260 : 0);
}
function choose(k){
  var st=RUN && RUN.q[RUN.pos];
  if(!st || RUN.phase!=='q' || !st.opts || k<0 || k>=st.opts.length) return;
  st.choice=k; answer(st.opts[k]===st.ans);
}
function tileTap(i){ var st=RUN.q[RUN.pos]; if(RUN.phase!=='q' || !st.tiles || !st.tiles[i] || st.tiles[i].used) return; st.tiles[i].used=true; st.picked.push(i); renderRun(); }
function untile(pi){ var st=RUN.q[RUN.pos]; if(RUN.phase!=='q' || !st.picked) return; var ti=st.picked.splice(pi,1)[0]; if(ti!=null) st.tiles[ti].used=false; renderRun(); }
function checkTiles(){
  var st=RUN.q[RUN.pos]; if(RUN.phase!=='q' || !st.picked || !st.picked.length) return;
  var got = st.t==='build' ? st.picked.map(function(i){ return st.tiles[i].ch; }).join('') : st.picked.map(function(i){ return norm(st.tiles[i].ch); }).join(' ');
  st.got=got; answer(got===st.ans);
}
function pairTap(side, k){
  var st=RUN.q[RUN.pos]; if(RUN.phase!=='q' || st.t!=='pairs' || st.matched[k]) return;
  if(side==='a') st.selA = st.selA===k ? null : k; else st.selB = st.selB===k ? null : k;
  if(st.selA!=null && st.selB!=null){
    if(st.selA===st.selB){
      st.matched[st.selA]=true; RUN.combo++; if(RUN.combo>RUN.maxCombo) RUN.maxCombo=RUN.combo;
      if(!RUN.replay) addXP(1); blip('ok'); questEvent('answer',{correct:true, production:false, combo:RUN.combo});
    } else {
      st.bad=[st.selA, st.selB]; st.err=true; RUN.mistakes[st.selA]=true; RUN.combo=0; blip('bad');
      setTimeout(function(){ if(RUN && RUN.q[RUN.pos]===st){ st.bad=null; renderRun(); } }, 600);
    }
    st.selA=null; st.selB=null;
    if(Object.keys(st.matched).length===st.items.length){
      if(!st.retry){ RUN.graded++; if(!st.err) RUN.first++; }
      checkQuests(); save();
      RUN.lastXP=0; RUN.phase='fb'; RUN.fb={ok:true, msg: st.err ? 'Toutes les paires sont trouvées.' : rnd(OKS)};
    }
  }
  renderRun();
}
function runNext(){
  if(!RUN || RUN.ended) return;
  var st=RUN.q[RUN.pos];
  if(RUN.phase==='q' && !(st.t==='intro'||st.t==='lintro'||st.t==='rule'||st.t==='story')) return;
  RUN.pos++; RUN.done++; RUN.phase='q'; RUN.fb=null; RUN.lastXP=0; RUN.quitArmed=false;
  if(RUN.pos>=RUN.q.length) return endRun();
  renderRun();
  var b=$('#ov .ov-body'); if(b) b.scrollTop=0;
}
function endRun(){
  var r=RUN, now=Date.now(), newWords=0, nm=Object.keys(r.mistakes).length;
  r.ended=true;
  if(r.kind==='vocab' || r.kind==='review'){
    r.words.forEach(function(w){
      var st=S.cards[w.id], miss=!!r.mistakes[w.id];
      if(!st){ st=S.cards[w.id]={b:0,d:0,l:0,r:0}; bumpNew(); newWords++; }
      else if(st.d>now) return; /* pas encore à réviser : entraînement, planning inchangé */
      var res=nextState(st, 2, miss); st.b=res.b; st.d=res.d; st.r=(st.r||0)+1; if(miss) st.l=(st.l||0)+1;
    });
    if(r.kind==='vocab') S.lessons[r.lesson.id]=true;
  }
  if(r.kind==='gram') S.lessons[r.lesson.id]=true;
  if(r.kind==='alpha'){
    if(!r.replay){ var ak=todayKey(); if(!S.alphaDay || S.alphaDay.k!==ak) S.alphaDay={k:ak,n:0}; S.alphaDay.n++; }
    S.alphaDone[r.group]=true;
  }
  if(r.kind==='lrev') S.lrevDay=todayKey();
  if(['lrev','trace','fc','ville','monde'].indexOf(r.kind)>=0) S.modes[r.kind]=(S.modes[r.kind]||0)+1;
  if(r.kind==='monde' && r.mondeKs) r.mondeKs.forEach(function(k){ S.mondeSeen[k]=true; });
  if(r.kind==='dlg' || r.kind==='story') recordPractice(r);
  pushWidgetWords();
  if(r.kind==='boss') bossFinish(r);
  if(!r.replay){ addXP(5); if(!nm) addXP(5); }
  markDay();
  questEvent('lesson-end',{kind:r.kind, mistakes:nm, newWords:newWords, replay:!!r.replay});
  checkQuests();
  var record=r.maxCombo>(S.bestCombo||0); if(record) S.bestCombo=r.maxCombo;
  save();
  var acc=r.graded ? Math.round(r.first/r.graded*100) : 100, li=levelInfo(S.xp), s=streak(), list='', nextBtn='';
  if(r.kind==='alpha'){
    list='<ul class="wl">'+alphaIdx(r.group).map(function(i){ var L=LETTERS[i]; return '<li><b class="ru" style="font-size:22px;min-width:56px">'+L[0]+L[1]+'</b><span class="small">'+esc(L[2])+'</span></li>'; }).join('')+'</ul>';
    var na=nextAlpha(); if(na>=0) nextBtn = alphaToday()>=1 ? '<button class="btn btn-primary" data-act="lrev">Réviser ces lettres</button>' : '<button class="btn btn-primary" data-act="alpha" data-g="'+na+'">Leçon suivante</button>';
  } else if(r.kind==='gram'){
    list='<ul class="wl">'+r.lesson.gram.items.map(function(it){ var f=gapFull(it); return '<li>'+sayBtn(f)+'<span><b class="ru">'+esc(f)+'</b> <span class="muted">· '+esc(it.fr)+'</span></span></li>'; }).join('')+'</ul>';
    if(nextLesson()) nextBtn='<button class="btn btn-primary" data-act="lesson-next">Leçon suivante</button>';
  } else if(r.kind==='boss'){
    list='<p class="big tnum" style="margin:6px 0">'+r.bossPct+' %</p><p>'+(r.bossWon ? (r.bossFirst ? '<b>Boss battu !</b> +50 XP et un gel de série.' : 'Boss déjà battu cette semaine.') : 'Il fallait 80 %. Révise un peu et retente ta chance.')+'</p>';
    nextBtn = r.bossWon ? '' : '<button class="btn btn-primary" data-act="boss">Retenter</button>';
  } else if(r.kind==='lrev' || r.kind==='trace'){
    list='<ul class="wl">'+r.letters.map(function(i){ var L=LETTERS[i], lv=lvlOf(i); return '<li><b class="ru" style="font-size:22px;min-width:56px">'+L[0]+L[1]+'</b><span class="small">'+esc(L[2])+' · '+(lv>=MASTER?'acquise':'niveau '+Math.min(lv,MASTER)+'/'+MASTER)+'</span></li>'; }).join('')+'</ul>';
    nextBtn='<button class="btn btn-primary" data-act="arcade">Jeu des 60 secondes</button>';
  } else if(r.list){
    list='<ul class="wl">'+r.list.map(function(x){ return '<li>'+sayBtn(x.say||x.ru)+'<span><b class="ru">'+esc(x.ru)+'</b> <span class="muted">· '+esc(x.fr)+'</span></span></li>'; }).join('')+'</ul>';
    nextBtn='<button class="btn btn-primary" data-act="'+r.kind+'">Rejouer</button>';
    if(r.kind==='dlg' || r.kind==='story'){
      var pk=r.kind==='dlg'?'d':'s', nx=nextUndone(pk, r.kind==='dlg'?r.dlg:r.story);
      nextBtn='<button class="btn btn-primary" data-act="'+r.kind+'" data-i="'+nx+'">'+(r.kind==='dlg'?'Dialogue suivant':'Histoire suivante')+'</button><button class="btn" data-act="'+r.kind+'" data-i="'+(r.kind==='dlg'?r.dlg:r.story)+'">Rejouer</button>';
    }
  } else {
    list='<ul class="wl">'+r.words.map(function(w){ return '<li>'+sayBtn(w.ru)+'<span><b class="ru">'+esc(w.ru)+'</b> <span class="muted">· '+esc(w.fr)+'</span></span></li>'; }).join('')+'</ul>';
    if(r.kind==='vocab' && nextLesson()) nextBtn='<button class="btn btn-primary" data-act="lesson-next">Leçon suivante</button>';
  }
  var title = {alpha:'Leçon d’alphabet terminée', review:'Révisions terminées', gram:'Leçon de grammaire terminée', lrev:'Révision des lettres terminée', trace:'Tracé terminé', fc:'Lecture terminée', ville:'Balade terminée', monde:'Écriture terminée', dlg:'Dialogue terminé', story:'Histoire terminée', kbd:'Clavier terminé', boss:(r.bossWon?'Défi de la semaine réussi':'Défi raté'), weak:'Révision terminée'}[r.kind] || 'Leçon terminée';
  if(r.replay) title += ' · entraînement';
  $('#ov').innerHTML='<div class="ov-top"><button class="x" data-act="close" aria-label="Fermer">'+XI+'</button><div class="bar"><i style="width:100%"></i></div>'+comboChip(0)+'</div>'
    +'<div class="ov-body"><section class="panel center"><p class="eyebrow">'+title+'</p><p class="big tnum">+'+r.xp+' XP</p>'
    +'<div class="sum"><div><b class="tnum">'+acc+' %</b><span>du premier coup</span></div><div><b class="tnum">'+r.maxCombo+'</b><span>combo max'+(record?' · record !':'')+'</span></div><div><b class="tnum">'+s+'</b><span>jour'+(s>1?'s':'')+' d’affilée</span></div></div>'
    +(nm ? '<p class="muted small">'+(r.kind==='alpha'||r.kind==='lrev'||r.kind==='trace'?'Les lettres ratées reviendront à ta prochaine révision.':r.kind==='gram'?'Refais cette leçon plus tard pour bien fixer la règle.':r.list?'Rejoue pour fixer ce que tu as raté.':'Les mots ratés reviennent dès demain.')+'</p>' : '<p class="muted small">Sans faute. Solide comme du béton.</p>')
    +(r.replay ? '<p class="small">Leçon déjà faite : l’XP est réduite et elle ne compte pas pour les quêtes de leçon.</p>' : '')
    +(r.quests.length ? '<ul class="qlist">'+r.quests.map(function(t){ return '<li>Quête terminée : '+esc(t)+'</li>'; }).join('')+'</ul>' : '')
    +'<p class="eyebrow" style="align-self:flex-start">'+(r.kind==='alpha'?'Les lettres de la leçon':r.kind==='lrev'||r.kind==='trace'?'Tes lettres':r.kind==='gram'||r.kind==='fc'?'Les phrases':r.kind==='ville'?'Les panneaux':r.kind==='dlg'?'Les bonnes réponses à retenir':r.kind==='story'?'Les mots utiles':'Les mots de la leçon')+'</p>'+list
    +'<div style="width:100%"><div class="lvl-bar"><i style="width:'+(li.into/li.need*100)+'%"></i></div><p class="small muted tnum" style="margin-top:4px">Niveau '+li.L+' · '+li.into+' / '+li.need+' XP pour l’étage '+(li.L+1)+'</p></div>'
    +'<div class="row" style="justify-content:center">'+nextBtn+'<button class="btn" data-act="close">Terminer</button></div></section></div>';
}


/* ================= Lettres : niveau, rythme, révision ciblée ================= */
function lvlOf(i){ return i<0 ? 0 : (S.letters['L'+i]||0); }
function letterIdxOf(ch){ ch=String(ch).toLowerCase(); for(var i=0;i<LETTERS.length;i++) if(LETTERS[i][1]===ch) return i; return -1; }
function introducedSet(){
  var s={};
  ALPHA_LESSONS.forEach(function(g,gi){ if(S.alphaDone[gi]) alphaIdx(gi).forEach(function(i){ s[i]=true; }); });
  LETTERS.forEach(function(_,i){ if(S.letters['L'+i]!=null) s[i]=true; });
  return s;
}
function introducedIdx(){ var s=introducedSet(); return LETTERS.map(function(_,i){ return i; }).filter(function(i){ return s[i]; }); }
function weakIdx(){ return introducedIdx().filter(function(i){ return lvlOf(i)<MASTER; }).sort(function(a,b){ return lvlOf(a)-lvlOf(b) || a-b; }); }
function alphaToday(){ return S.alphaDay && S.alphaDay.k===todayKey() ? S.alphaDay.n : 0; }
function lrevDoneToday(){ return S.lrevDay===todayKey(); }
function lastAlphaGroup(){ var g=0; ALPHA_LESSONS.forEach(function(_,gi){ if(S.alphaDone[gi]) g=gi; }); return g; }
function lookalikesOf(i){
  var L=LETTERS[i], out=[];
  (LOOK[L[0]]||[]).forEach(function(u){ var j=letterIdxOf(u); if(j>=0 && out.indexOf(j)<0) out.push(j); });
  return out;
}
function wordsWithLetter(ch){
  return CARDS.filter(function(c){ var p=plain(c.ru).toLowerCase(); return /^[а-яё]{3,8}$/.test(p) && p.indexOf(ch)>=0; });
}
function lrevSteps(ids){
  var s=[];
  ids.forEach(function(i,k){
    if(lvlOf(i)<=1) s.push({t:'lintro', i:i, recap:true});
    s.push(mkL(k%2 ? 's2l' : 'l2s', i));
  });
  if(ids.length>=2) pushIf(s, mkLPairs(shuffle(ids.slice()).slice(0,5), lastAlphaGroup()));
  ids.forEach(function(i){
    var ch=LETTERS[i][1], ws=shuffle(wordsWithLetter(ch));
    if(ws.length) pushIf(s, mkMiss(ws[0], ch));
    var rs=READING.map(function(_,ri){ return ri; }).filter(function(ri){ return plain(READING[ri][0]).toLowerCase().indexOf(ch)>=0; });
    if(rs.length && (ids.length<=2 || Math.random()<0.5)) s.push(mkRead(rnd(rs)));
  });
  if(ids.length) s.push(mkTrace(ids[0]));
  shuffle(ids.slice()).forEach(function(i,k){ s.push(mkL(TRAPS[LETTERS[i][0]] || k%2 ? 'l2s' : 's2l', i)); });
  return s;
}
function startLrev(ids){
  ids=(ids && ids.length ? ids : weakIdx()).slice(0,6);
  if(!ids.length){ toast(introducedIdx().length ? 'Toutes tes lettres sont acquises. Le jeu des 60 secondes les garde en forme.' : 'Commence par une leçon d’alphabet.'); return false; }
  startRun('lrev', lrevSteps(ids), {letters:ids});
  return true;
}
function startLrevOne(i){ startLrev([i].concat(lookalikesOf(i).slice(0,2))); }

    +'<p>Tu as déjà fait '+(n>1 ? n+' leçons' : 'une leçon')+' d’alphabet aujourd’hui. Le cerveau retient bien 5 à 7 nouvelles lettres par jour. Au-delà, elles se mélangent, comme и et й.</p>'
    +'<p class="small muted">Le plus efficace : réviser les lettres d’aujourd’hui, puis faire la leçon suivante demain.</p>'

/* ================= Prononciation en lettres françaises : sur demande ================= */
function pronOn(){ return S.settings.pron==='show'; }
function prBlock(pr, label){

    : '<button class="pron-hide" data-act="pr-reveal" data-pr="'+esc(pr)+'">'+esc(label||'Voir la prononciation')+'</button>';
}
function prInline(pr){
  if(!pr) return '';

/* ================= Syllabes et lecture lettre par lettre ================= */
var VOW='аеёиоуыэюя';

/* Faux amis : ce que l'œil français lit à tort */
var FAUX={'в':'b','н':'h','р':'p','с':'k','у':'i','х':'ks','и':'u','я':'r','п':'n','г':'r','ь':'b','е':'é'};

  base.forEach(function(b,i){ if(VOW.indexOf(b)>=0) v.push(i); });
  if(v.length<2) return [ch.join('')];
  var cuts=[];
  for(var k=0;k<v.length-1;k++){
    var a=v[k], b=v[k+1], n=b-a-1, keep=0, cut;
    while(keep<n && 'йьъ'.indexOf(base[a+1+keep])>=0) keep++;
    if(keep>0) cut=a+1+keep;            /* й, ь, ъ restent avec la syllabe d'avant */
    else if(n<=1) cut=a+1;              /* V-CV */
    else cut=a+2;                       /* VC-CV */
    while(cut<b && 'ьъ'.indexOf(base[cut])>=0) cut++;
    cuts.push(cut);
  }
  var out=[], prev=0; cuts.forEach(function(c){ out.push(ch.slice(prev,c).join('')); prev=c; }); out.push(ch.slice(prev).join(''));

}

  var out=[]; syllables(word).forEach(function(s,si){ chunksOf(s).forEach(function(c){ out.push({b:c.charAt(0).toLowerCase(), si:si}); }); });
  return out;
}
function readOf(letters, rep){
  var parts=[];
  letters.forEach(function(l,j){ var t = rep && rep[j]!=null ? rep[j] : (TR[l.b]!=null ? TR[l.b] : l.b); parts[l.si]=(parts[l.si]||'')+t; });

function sylWordOK(ru){ var p=plain(ru).toLowerCase(); return /^[а-яё]{3,14}$/.test(p) && syllables(p).length>=2; }

  if(!sylWordOK(w.ru)) return null;
  var lw=sylLetters(plain(w.ru).toLowerCase()), ans=readOf(lw), SW={'a':'o','o':'a','i':'y','ou':'o','ié':'é','ia':'a'};
  var faux=[], conf=[], sw=[], out=[], why={}, seen={}; seen[ans]=1;
  lw.forEach(function(l,j){
    if(FAUX[l.b]) faux.push([j,FAUX[l.b],'faux']);
    var c=CONF[l.b]; if(c && TR[c]!==TR[l.b]) conf.push([j,TR[c],'conf',c]);
    if(SW[TR[l.b]]) sw.push([j,SW[TR[l.b]],'sw']);
  });

    shuffle(list).forEach(function(x){
      if(out.length>=max) return;
      var o={}; o[x[0]]=x[1]; var r=readOf(lw,o);
      if(seen[r]) return; seen[r]=1; out.push(r); why[r]={b:lw[x[0]].b, kind:x[2], alt:x[3]};
    });
  }
  take(faux,2); take(conf,3); take(sw,3);
  if(out.length<2) return null;
  return {t:'syll', w:w, mk:'syll', syl:syllables(w.ru), opts:shuffle([ans].concat(out.slice(0,3))), ans:ans, why:why};
}
function syllWhy(st){
  var y=st.why && st.why[st.opts[st.choice]]; if(!y) return '';

  if(y.kind==='faux'){
    if(y.b==='ь') return U+' ne se prononce pas : il adoucit la lettre d’avant. Ce n’est pas un « b ».';
    return U+' se lit « '+esc(TR[y.b])+' », pas « '+esc(FAUX[y.b])+' » : c’est un faux ami.';
  }
  if(y.kind==='conf' && SOSIES[sosieKey(y.b,y.alt)]) return esc(SOSIES[sosieKey(y.b,y.alt)]);

/* ================= Lettre manquante ================= */
var ALLW=null;

function mkMiss(w, want){
  var word=plain(w.ru).toLowerCase();
  if(!/^[а-яё\-]{2,14}$/.test(word)) return null;
  var pos=[];
  word.split('').forEach(function(c,i){ if(c!=='-' && (!want || c===want)) pos.push(i); });
  if(!pos.length) return null;
  pos=shuffle(pos).sort(function(a,b){ return lvlOf(letterIdxOf(word[a]))-lvlOf(letterIdxOf(word[b])); });
  var p = want ? pos[0] : pos[Math.floor(Math.random()*Math.min(2,pos.length))], c=word[p], set=[c], aw=allWords();
  function add(x){ if(x && set.length<4 && set.indexOf(x)<0 && !aw[word.slice(0,p)+x+word.slice(p+1)]) set.push(x); }
  add(CONF[c]);
  (LOOK[c.toUpperCase()]||[]).forEach(function(u){ add(u.toLowerCase()); });
  var A='абвгдежзийклмнопрстуфхцчшщыьэюя', g=0;
  while(set.length<4 && g++<80) add(A.charAt(Math.floor(Math.random()*A.length)));
  return {t:'miss', w:w, mk:'miss', word:word, p:p, opts:shuffle(set), ans:c};
}

/* ================= La ville soviétique ================= */
function signW(k){ var G=SIGNS[k]; return {id:'S'+k, k:k, ru:G[0], pr:G[1], fr:G[2], note:G[3], say:G[0].toLowerCase(), sign:true, ex:'', exfr:''}; }
function clashes(a, b){ return SIGN_CLASH.some(function(c){ return c.indexOf(a)>=0 && c.indexOf(b)>=0; }); }
function mkSign(w){
  var k=w.k, me=SIGNS[k][0], set=[SIGNS[k][2]], used=[me];
  function add(j){ var o=SIGNS[j]; if(set.length<4 && set.indexOf(o[2])<0 && !used.some(function(u){ return clashes(u,o[0]); })){ set.push(o[2]); used.push(o[0]); } }
  if(SIGN_TWINS[me]) SIGNS.forEach(function(o,j){ if(o[0]===SIGN_TWINS[me]) add(j); });
  shuffle(SIGNS.map(function(_,j){ return j; }).filter(function(j){ return j!==k; })).forEach(add);
  return {t:'sign', w:w, mk:'sign', opts:shuffle(set), ans:SIGNS[k][2], style:k%4};
}

  var ks=shuffle(SIGNS.map(function(_,k){ return k; })).slice(0,10), s=[], list=[];

  ARC={pool:pool, score:0, combo:0, maxCombo:0, best:S.arcadeBest||0, end:Date.now()+60000, cur:-1, last:-1, opts:[], ans:'', missed:{}, gained:{}, wrongK:-1, lock:false, over:false, n:0, ok:0};

}
function arcPickLetter(){
  var tot=0, ws=ARC.pool.map(function(i){ var w = i===ARC.last ? 0 : (6-Math.min(5,lvlOf(i))); tot+=w; return w; }), r=Math.random()*tot;
  for(var k=0;k<ws.length;k++){ r-=ws[k]; if(r<0) return ARC.pool[k]; }

}
function arcNext(){

}
function arcLeft(){ return Math.max(0, ARC.end-Date.now()); }
function arcTick(){

  var bar=document.getElementById('arc-bar'), t=document.getElementById('arc-time');

}
function arcPick(k){

/* ================= Défi de la semaine ================= */

}
function bossDow(){ return window.__bossDay!=null ? window.__bossDay : new Date().getDay(); }

function bossSteps(){
  var now=Date.now(), learned=CARDS.filter(function(c){ var x=S.cards[c.id]; return x && x.b>=1; });
  var week=learned.filter(function(c){ var x=S.cards[c.id], last=x.d-(IV[Math.min(x.b,IV.length-1)]||0)*864e5; return last>=now-7*864e5; });
  var pool=shuffle(week).concat(shuffle(learned.filter(function(c){ return week.indexOf(c)<0; }))).slice(0,8), s=[];
  pool.forEach(function(c,k){

  shuffle(lets.slice()).slice(0, Math.max(2, 10-s.length)).forEach(function(i,k){ var st=mkL(k%2?'s2l':'l2s', i); st.noRequeue=true; s.push(st); });

  var clean=String(t).replace(/\s*\(.*?\)\s*/g,' ').trim();

  var pool=shuffle(due).concat(shuffle(learned.filter(function(c){ return due.indexOf(c)<0; })));
  if(pool.length<8){ var seen=CARDS.filter(function(c){ return S.cards[c.id] && pool.indexOf(c)<0; }); pool=pool.concat(shuffle(seen)); }
  if(pool.length<8){ pool=pool.concat(CARDS.filter(function(c){ return c.deck==='bases' && pool.indexOf(c)<0; })); }

function kbWordOK(c){ return /^[а-яё]{2,10}$/.test(plain(c.ru).toLowerCase()); }
function mkKbd(c, mode){ return {t:'kbd', w:c, mode:mode, ans:plain(c.ru).toLowerCase(), typed:'', hint:false}; }
function startKbd(){
  var learned=CARDS.filter(function(c){ return S.cards[c.id] && kbWordOK(c); });
  var pool=shuffle(learned.slice());
  if(pool.length<10) pool=pool.concat(shuffle(CARDS.filter(function(c){ return kbWordOK(c) && pool.indexOf(c)<0 && (c.deck==='bases'||c.deck==='ville'||c.deck==='nourriture'); })));
  pool=pool.slice(0,10);
  var byLen=function(a,b){ return plain(a.ru).length-plain(b.ru).length; };
  var known=pool.filter(function(c){ return S.cards[c.id]; }).sort(byLen), frW=known.slice(Math.max(0, known.length-5));
  var copyW=pool.filter(function(c){ return frW.indexOf(c)<0; }).sort(byLen);
  if(copyW.length<5){ var move=frW.splice(0, 5-copyW.length); copyW=copyW.concat(move).sort(byLen); }
  pool=copyW.concat(frW);
  var s=copyW.map(function(c){ return mkKbd(c,'copy'); }).concat(frW.map(function(c){ return mkKbd(c,'fr'); }));
  startRun('kbd', s, {list:pool.map(function(c){ return {ru:c.ru, fr:c.fr}; })});
}

function kbType(ch){
  var st=RUN && RUN.q[RUN.pos]; if(!st || st.t!=='kbd' || RUN.phase!=='q') return;
  if(st.mode==='copy' && ch!==st.ans.charAt(st.typed.length)){ blip('bad'); var b=document.querySelector('#ov .kb-key[data-k="'+ch+'"]'); if(b){ b.classList.add('wrong'); setTimeout(function(){ b.classList.remove('wrong'); }, 300); } st.errs=(st.errs||0)+1; return; }

function buildMsgs(){
  var turns = CHAT.filter(function(m){ return m.role==='user'||m.role==='assistant'; })
    .map(function(m){ return {role:m.role, content: m.role==='user' ? m.text : JSON.stringify(m.data)}; })
    .slice(-14);
  var out=[];
  turns.forEach(function(t){ var last=out[out.length-1]; if(last && last.role===t.role) last.content += '\n'+t.content; else out.push({role:t.role, content:t.content}); });
  if(out[0].role==='assistant') out.unshift({role:'user', content:'(Début de la séance.)'});
  out[0].content = PROMPT + '\n\n--- Conversation ---\nÉlève : ' + out[0].content;
  return out;
}
function normReply(v){
  if(typeof v==='string'){
    var m=v.match(/\{[\s\S]*\}/);
    if(!m) return {aide:v};
    try{ v=JSON.parse(m[0]); }catch(e){ return {aide:v}; }
  }
  if(!v || typeof v!=='object') return {aide:String(v)};
  function s(x){ return (typeof x==='string' && x.trim()) ? x.trim() : null; }
  return {correction:s(v.correction), aide:s(v.aide), ru:s(v.ru), prononciation:s(v.prononciation), fr:s(v.fr)};
}
function sendChat(text){
  text=String(text||'').trim();
  if(!text || chatBusy || !sampleFn) return;
  var ci=$('#chat-in'); if(ci) ci.value='';
  CHAT.push({role:'user', text:text}); chatBusy=true;
  if(VIEW==='prof') render();
  var call = typeof sampleFn.json==='function' ? sampleFn.json(buildMsgs(), {modelTier:'default', cache:false}) : sampleFn(buildMsgs(), {modelTier:'default', cache:false}).then(function(r){ return r && r.text; });
  Promise.resolve(call).then(function(val){
    CHAT.push({role:'assistant', data:normReply(val)});
    var cyr=/[а-яё]/i.test(text);
    addXP(cyr?10:3);
    if(cyr) questEvent('prof');
    markDay(); checkQuests(); save();
  }, function(e){
    var code=e&&e.code;
    if(code==='not_granted') CHAT.push({role:'error', text:'L’accès à Claude a été refusé pour cette page. Autorise-le pour discuter avec le prof.'});
    else if(code==='rate_limited') CHAT.push({role:'error', text:'Le prof est débordé. Réessaie dans une minute.'});
    else if(e && e.text) CHAT.push({role:'assistant', data:normReply(e.text)});
    else CHAT.push({role:'error', text:'Le prof n’a pas pu répondre. Réessaie.'});
  }).then(function(){ chatBusy=false; if(VIEW==='prof') render(); });
}

    case 'set-pron': S.settings.pron=el.dataset.v; save(); render(true); refreshSettings(); break;
    case 'native-voice': try{ NATIVE.installVoice(); }catch(e){} toast('Choisis « Russe », télécharge la voix, puis reviens dans l’appli.'); break;
    case 'set-notif-time': var hm=String(el.dataset.v).split(':'); S.settings.notif={on:true, h:+hm[0], m:+hm[1]}; save(); applyNativeReminder(); refreshSettings(); toast('Rappel programmé à '+hm[0]+'h'+(hm[1]==='0'?'':hm[1])+'.'); break;
    case 'reset-open': openReset(); break;
    case 'reset-confirm': doReset(); break;
    case 'mic': micStart(); break;
    case 'speak-self': if(curSpeak()) speakResult(true, '', ''); break;
    case 'speak-retry': if(RUN && RUN.phase==='fb'){ var sp=RUN.q[RUN.pos]; sp.final=''; sp.heard=''; sp.msg=''; sp.heardFinal=''; RUN.phase='q'; RUN.fb=null; renderRun(); } break;
    case 'cant-listen': cantListen(); break;
    case 'cant-speak': cantSpeak(); break;
    case 'sound-toggle': soundToggle(); break;
    case 'unpause': S.noListenUntil=0; S.noSpeakUntil=0; save(); render(true); refreshSettings(); toast('Écoute et parole réactivées.'); break;
    case 'q-go': questGo(el.dataset.id); break;
    case 'q-reroll': rerollQuest(+el.dataset.i); break;
    case 'chest': openChest(); break;
    case 'chip': sendChat(el.dataset.t); break;
    case 'chat-clear': CHAT=[CHAT_INTRO]; render(); break;
  }
});
document.addEventListener('change', function(e){
  var t=e.target;
  if(t.dataset && t.dataset.task){ S.plan[t.dataset.task]=t.checked; save(); render(true); }
  else if(t.dataset && t.dataset.deck){ if(t.checked) delete S.decksOff[t.dataset.deck]; else S.decksOff[t.dataset.deck]=true; save(); render(true); }
  else if(t.id==='set-auto'){ S.settings.auto=t.checked; save(); refreshSettings(); }
  else if(t.id==='set-sfx'){ S.settings.sfx=t.checked; save(); if(t.checked) blip('ok'); refreshSettings(); }
  else if(t.id==='set-listen'){ S.settings.listen=t.checked; if(t.checked) S.noListenUntil=0; save(); render(true); refreshSettings(); }
  else if(t.id==='set-notif'){ var cur=S.settings.notif||{h:19,m:0}; S.settings.notif={on:t.checked, h:cur.h, m:cur.m}; save(); applyNativeReminder(); refreshSettings(); }
  else if(t.id==='set-speak'){ S.settings.speak=t.checked; if(t.checked) S.noSpeakUntil=0; save(); render(true); refreshSettings(); }
});
document.addEventListener('submit', function(e){
  if(e.target.dataset && e.target.dataset.form==='chat'){ e.preventDefault(); var ci=$('#chat-in'); sendChat(ci?ci.value:''); }
});
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){ if(!$('#sheet').hidden) closeSheet(); else if(!$('#ov').hidden) closeOverlay(); return; }
  if($('#ov').hidden || e.target.tagName==='INPUT') return;
  if(ARC){ if(!ARC.over && ['1','2','3','4'].indexOf(e.key)>=0){ e.preventDefault(); arcPick(+e.key-1); } return; }
  if(AUD){ if(e.key===' '){ e.preventDefault(); audToggle(); } return; }
  if(RUN && RUN.phase==='q' && RUN.q[RUN.pos] && RUN.q[RUN.pos].t==='kbd' && !e.ctrlKey && !e.metaKey && !e.altKey){
    if(e.key==='Backspace'){ e.preventDefault(); kbBack(); return; }
    var kk = /^[а-яё]$/i.test(e.key) ? e.key.toLowerCase() : KB_CODES[e.code];
    if(kk){ e.preventDefault(); kbType(kk); return; }
  }
  if(RUN){
    if(RUN.ended) return;
    var rs=RUN.q[RUN.pos];
    if(e.key==='Enter'){
      if(rs.t==='trace' && RUN.phase==='q'){ e.preventDefault(); traceCheck(); return; }
      if(RUN.phase==='fb' || rs.t==='intro' || rs.t==='lintro' || rs.t==='rule'){ e.preventDefault(); runNext(); }
      else if(rs.picked && rs.picked.length){ e.preventDefault(); checkTiles(); }
      return;
    }
    if(RUN.phase==='q' && rs.opts && ['1','2','3','4'].indexOf(e.key)>=0){ e.preventDefault(); choose(+e.key-1); }
    return;
  }
  if(SES && !SES.finished){
    if((e.key===' '||e.key==='Enter') && !SES.flipped && !(e.target.closest && e.target.closest('button:not([data-act="flip"])'))){ e.preventDefault(); flip(); }
    else if(SES.flipped && ['1','2','3','4'].indexOf(e.key)>=0){ e.preventDefault(); grade(+e.key-1); }
  } else if(QZ && !QZ.done && !QZ.answered && ['1','2','3','4'].indexOf(e.key)>=0){ pick(+e.key-1); }
});

/* ---------- Démarrage ---------- */
applyFreezes();
if(NATIVE){
  if(NATIVE_INFO && NATIVE_INFO.stt) initDict(nativeDict());
  applyNativeReminder();
  pushWidgetWords();
  nativeSaveNow();
  [400, 1200, 3000].forEach(function(t){ setTimeout(function(){ var before=nativeRu(); nativeRefresh(); if(nativeRu()!==before){ if($('#ov').hidden) render(true); refreshSettings(); } }, t); });
  document.addEventListener('visibilitychange', function(){ if(!document.hidden){ var before=nativeRu(); nativeRefresh(); if(nativeRu()!==before){ if($('#ov').hidden) render(true); refreshSettings(); } } });
}
render();
setTimeout(function(){ VOICE_CHECKED=true; if(hasTTS()) pickVoice(); if(VIEW==='aujourdhui' && $('#ov').hidden) render(true); }, 2500);
(function waitClaude(t0){
  if(window.claude && typeof window.claude.use==='function'){
    var c=window.claude;
    c.use('sample').then(function(s){ sampleFn=s||null; }, function(){ sampleFn=null; }).then(function(){ if(sampleFn===null) dropUnavailableQuests(); if(VIEW==='prof') render(); });
    c.use('dictation').then(initDict, function(){ DICT=null; });
    c.use('tts').then(function(t){ tts=t||null; }, function(){ tts=null; }).then(function(){ if(VIEW==='lecons' && $('#ov').hidden) render(true); });
    initRemote(c);
    return;
  }
  if(Date.now()-t0>5000){ sampleFn=null; dropUnavailableQuests(); if(VIEW==='prof') render(); return; }
  setTimeout(function(){ waitClaude(t0); },150);
})(Date.now());

})();
</script>
